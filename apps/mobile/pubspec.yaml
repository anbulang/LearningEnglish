name: learning_english_mobile
description: LearningEnglish adaptive Flutter app for phone and tablet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  go_router: ^14.8.1
  image_picker: ^1.1.2
  learning_english_contracts:
    path: ../../packages/contracts
  learning_english_design_tokens:
    path: ../../packages/design_tokens
  path_provider: ^2.1.5
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/heroes/
    - assets/images/topics/
    - assets/images/states/
    - assets/images/vocabulary/
