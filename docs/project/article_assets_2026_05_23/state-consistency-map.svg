<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">State consistency map</title>
  <desc id="desc">A product state machine from upload to review to ready to archive.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="100%" stop-color="#edf1ef"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5b5b5b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="120" y="132" font-family="Helvetica, Arial, sans-serif" font-size="56" fill="#5f4632">A product gets real when states agree</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="120" y="280" width="240" height="120" rx="28" fill="#f3c980" filter="url(#shadow2)"/>
    <text x="176" y="352" font-size="34" fill="#6f4a2f">Upload</text>
    <rect x="430" y="280" width="260" height="120" rx="28" fill="#a7d6cb" filter="url(#shadow2)"/>
    <text x="470" y="352" font-size="34" fill="#355f57">Queued / Processing</text>
    <rect x="760" y="200" width="260" height="120" rx="28" fill="#f0d3b6" filter="url(#shadow2)"/>
    <text x="816" y="272" font-size="34" fill="#7b5538">Needs Review</text>
    <rect x="760" y="430" width="260" height="120" rx="28" fill="#d98673" filter="url(#shadow2)"/>
    <text x="856" y="502" font-size="34" fill="#fff7f2">Failed</text>
    <rect x="1090" y="280" width="220" height="120" rx="28" fill="#8bb39d" filter="url(#shadow2)"/>
    <text x="1162" y="352" font-size="34" fill="#21483b">Ready</text>
    <rect x="1360" y="280" width="140" height="120" rx="28" fill="#d3d3d3" filter="url(#shadow2)"/>
    <text x="1388" y="352" font-size="32" fill="#4c4c4c">Archived</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="16">
    <path d="M360 340h50" stroke="#c47c52"/>
    <path d="M382 314l38 26-38 26" fill="#c47c52" stroke="none"/>
    <path d="M690 340h40" stroke="#5d8f84"/>
    <path d="M712 314l38 26-38 26" fill="#5d8f84" stroke="none"/>
    <path d="M690 368c62 78 108 106 160 106" stroke="#c76855"/>
    <path d="M830 456l28 38 30-30" stroke="#c76855"/>
    <path d="M1020 340h44" stroke="#6d9f88"/>
    <path d="M1042 314l38 26-38 26" fill="#6d9f88" stroke="none"/>
    <path d="M1310 340h28" stroke="#8a8a8a"/>
    <path d="M1322 314l38 26-38 26" fill="#8a8a8a" stroke="none"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6d5a49">
    <text x="426" y="448">Auto polling keeps the page honest</text>
    <text x="738" y="610">Retry should change both job and material</text>
    <text x="1038" y="190">Only ready items enter lessons and review</text>
    <text x="1262" y="472">Archive removes downstream visibility</text>
  </g>
</svg>
