# Harness override for the family walkthrough screenshot test.
# Run alongside the base compose file:
#   docker compose --env-file infra/.env \
#     -f infra/docker-compose.yml -f infra/docker-compose.harness.yml up -d
#
# Publishes the API on :8010 (the port the walkthrough integration test targets)
# instead of the base :8000, so it does not collide with anything already on
# :8000, and points generated-media URLs back at that host port.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  api:
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: "http://127.0.0.1:8010"
    # Replace the base port mapping rather than appending to it (Compose merges
    # `ports` by appending, which would also keep the :8000 binding and fail on
    # hosts where :8000 is taken).
    # NOTE: the `!override` tag requires Docker Compose >= 2.24.4. On older
    # plugins, run instead with `API_PORT=8010 docker compose ... up` and drop
    # this `ports:` block.
    ports: !override
      - "8010:8000"
  worker:
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: "http://127.0.0.1:8010"
