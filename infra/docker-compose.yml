services:
  postgres:
    image: postgres:16
    container_name: learning-english-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_english}
      POSTGRES_USER: ${POSTGRES_USER:-learning_english}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_english}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: learning-english-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    container_name: learning-english-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../services/api
    container_name: learning-english-api
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://learning_english:learning_english@postgres:5432/learning_english
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-learning-english}
      OBJECT_STORAGE_USE_PATH_STYLE: "true"
      AI_PROVIDER: ${AI_PROVIDER:-qwen}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      DOUBAO_VISION_MODEL_OR_ENDPOINT: ${DOUBAO_VISION_MODEL_OR_ENDPOINT:-}
      DOUBAO_TEXT_MODEL_OR_ENDPOINT: ${DOUBAO_TEXT_MODEL_OR_ENDPOINT:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_COMPATIBLE_BASE_URL: ${DASHSCOPE_COMPATIBLE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-max-latest}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-180}
      AI_MAX_IMAGE_COUNT: ${AI_MAX_IMAGE_COUNT:-5}
      AI_HTTP_TRUST_ENV: ${AI_HTTP_TRUST_ENV:-false}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-real}
      MEDIA_IMAGE_PROVIDER: ${MEDIA_IMAGE_PROVIDER:-dashscope}
      MEDIA_TTS_PROVIDER: ${MEDIA_TTS_PROVIDER:-dashscope}
      MEDIA_IMAGE_MODEL: ${MEDIA_IMAGE_MODEL:-wan2.6-image}
      MEDIA_IMAGE_EDIT_MODEL: ${MEDIA_IMAGE_EDIT_MODEL:-wanx2.1-imageedit}
      MEDIA_TTS_MODEL: ${MEDIA_TTS_MODEL:-cosyvoice-v3-flash}
      MEDIA_TTS_US_VOICE: ${MEDIA_TTS_US_VOICE:-longanyang}
      MEDIA_TTS_UK_VOICE: ${MEDIA_TTS_UK_VOICE:-longanhuan}
      MEDIA_REQUEST_TIMEOUT_SECONDS: ${MEDIA_REQUEST_TIMEOUT_SECONDS:-180}
      MEDIA_HTTP_TRUST_ENV: ${MEDIA_HTTP_TRUST_ENV:-false}
      MEDIA_PROVIDER_POLL_INTERVAL_SECONDS: ${MEDIA_PROVIDER_POLL_INTERVAL_SECONDS:-10}
      MEDIA_PROVIDER_MAX_POLL_SECONDS: ${MEDIA_PROVIDER_MAX_POLL_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-dashscope}
      SPEECH_ASSESSMENT_PROVIDER: ${SPEECH_ASSESSMENT_PROVIDER:-dashscope}
      SPEECH_ASSESSMENT_BASE_URL: ${SPEECH_ASSESSMENT_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      SPEECH_ASSESSMENT_APP_KEY: ${SPEECH_ASSESSMENT_APP_KEY:-}
      SPEECH_ASSESSMENT_SECRET_KEY: ${SPEECH_ASSESSMENT_SECRET_KEY:-}
      SPEECH_ASSESSMENT_ASR_MODEL: ${SPEECH_ASSESSMENT_ASR_MODEL:-paraformer-v2}
      SPEECH_ASSESSMENT_SCORING_MODEL: ${SPEECH_ASSESSMENT_SCORING_MODEL:-qwen-plus}
      SPEECH_ASSESSMENT_POLL_INTERVAL_SECONDS: ${SPEECH_ASSESSMENT_POLL_INTERVAL_SECONDS:-1}
      SPEECH_ASSESSMENT_MAX_POLL_SECONDS: ${SPEECH_ASSESSMENT_MAX_POLL_SECONDS:-120}
      SPEECH_ASSESSMENT_TIMEOUT_SECONDS: ${SPEECH_ASSESSMENT_TIMEOUT_SECONDS:-120}
      SPEECH_ASSESSMENT_HTTP_TRUST_ENV: ${SPEECH_ASSESSMENT_HTTP_TRUST_ENV:-false}
      SPEECH_ASSESSMENT_DEFAULT_ACCENT: ${SPEECH_ASSESSMENT_DEFAULT_ACCENT:-am}
      SPEECH_ASSESSMENT_AUDIO_PUBLIC_BASE_URL: ${SPEECH_ASSESSMENT_AUDIO_PUBLIC_BASE_URL:-}
      SPEAKING_AUDIO_MAX_BYTES: ${SPEAKING_AUDIO_MAX_BYTES:-10485760}
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ..
      dockerfile: services/workers/Dockerfile
    container_name: learning-english-worker
    depends_on:
      - redis
      - postgres
      - minio
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://learning_english:learning_english@postgres:5432/learning_english
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-learning-english}
      OBJECT_STORAGE_USE_PATH_STYLE: "true"
      AI_PROVIDER: ${AI_PROVIDER:-qwen}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      DOUBAO_VISION_MODEL_OR_ENDPOINT: ${DOUBAO_VISION_MODEL_OR_ENDPOINT:-}
      DOUBAO_TEXT_MODEL_OR_ENDPOINT: ${DOUBAO_TEXT_MODEL_OR_ENDPOINT:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_COMPATIBLE_BASE_URL: ${DASHSCOPE_COMPATIBLE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-max-latest}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-180}
      AI_MAX_IMAGE_COUNT: ${AI_MAX_IMAGE_COUNT:-5}
      AI_HTTP_TRUST_ENV: ${AI_HTTP_TRUST_ENV:-false}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-real}
      MEDIA_IMAGE_PROVIDER: ${MEDIA_IMAGE_PROVIDER:-dashscope}
      MEDIA_TTS_PROVIDER: ${MEDIA_TTS_PROVIDER:-dashscope}
      MEDIA_IMAGE_MODEL: ${MEDIA_IMAGE_MODEL:-wan2.6-image}
      MEDIA_IMAGE_EDIT_MODEL: ${MEDIA_IMAGE_EDIT_MODEL:-wanx2.1-imageedit}
      MEDIA_TTS_MODEL: ${MEDIA_TTS_MODEL:-cosyvoice-v3-flash}
      MEDIA_TTS_US_VOICE: ${MEDIA_TTS_US_VOICE:-longanyang}
      MEDIA_TTS_UK_VOICE: ${MEDIA_TTS_UK_VOICE:-longanhuan}
      MEDIA_REQUEST_TIMEOUT_SECONDS: ${MEDIA_REQUEST_TIMEOUT_SECONDS:-180}
      MEDIA_HTTP_TRUST_ENV: ${MEDIA_HTTP_TRUST_ENV:-false}
      MEDIA_PROVIDER_POLL_INTERVAL_SECONDS: ${MEDIA_PROVIDER_POLL_INTERVAL_SECONDS:-10}
      MEDIA_PROVIDER_MAX_POLL_SECONDS: ${MEDIA_PROVIDER_MAX_POLL_SECONDS:-180}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-dashscope}
      SPEECH_ASSESSMENT_PROVIDER: ${SPEECH_ASSESSMENT_PROVIDER:-dashscope}
      SPEECH_ASSESSMENT_BASE_URL: ${SPEECH_ASSESSMENT_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      SPEECH_ASSESSMENT_APP_KEY: ${SPEECH_ASSESSMENT_APP_KEY:-}
      SPEECH_ASSESSMENT_SECRET_KEY: ${SPEECH_ASSESSMENT_SECRET_KEY:-}
      SPEECH_ASSESSMENT_ASR_MODEL: ${SPEECH_ASSESSMENT_ASR_MODEL:-paraformer-v2}
      SPEECH_ASSESSMENT_SCORING_MODEL: ${SPEECH_ASSESSMENT_SCORING_MODEL:-qwen-plus}
      SPEECH_ASSESSMENT_POLL_INTERVAL_SECONDS: ${SPEECH_ASSESSMENT_POLL_INTERVAL_SECONDS:-1}
      SPEECH_ASSESSMENT_MAX_POLL_SECONDS: ${SPEECH_ASSESSMENT_MAX_POLL_SECONDS:-120}
      SPEECH_ASSESSMENT_TIMEOUT_SECONDS: ${SPEECH_ASSESSMENT_TIMEOUT_SECONDS:-120}
      SPEECH_ASSESSMENT_HTTP_TRUST_ENV: ${SPEECH_ASSESSMENT_HTTP_TRUST_ENV:-false}
      SPEECH_ASSESSMENT_DEFAULT_ACCENT: ${SPEECH_ASSESSMENT_DEFAULT_ACCENT:-am}
      SPEECH_ASSESSMENT_AUDIO_PUBLIC_BASE_URL: ${SPEECH_ASSESSMENT_AUDIO_PUBLIC_BASE_URL:-}
      SPEAKING_AUDIO_MAX_BYTES: ${SPEAKING_AUDIO_MAX_BYTES:-10485760}

volumes:
  postgres_data:
  minio_data:
