[project]
name = "learning-english-api"
version = "0.1.0"
description = "FastAPI vertical slice for LearningEnglish"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.12.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
