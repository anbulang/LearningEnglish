[project]
name = "learning-english-workers"
version = "0.1.0"
description = "Celery workers for LearningEnglish"
requires-python = ">=3.9"
dependencies = [
  "celery[redis]>=5.5.0,<6.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "PyJWT>=2.10.0,<3.0.0",
  "boto3>=1.37.0,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
]
